name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Grant Gradle permissions
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Compile and test
        run: ./gradlew check --no-daemon

  docs-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Required documentation present
        run: |
          set -e
          test -f README.md
          test -f LICENSE
          test -f docs/communications-health/research.md
          test -f docs/communications-health/architecture.md
          test -f docs/communications-health/phases.md
          test -f docs/communications-health/references.md
          test -f docs/communications-health/driver-link.md
          test -f docs/communications-health/build-vs-adopt.md
          test -f docs/communications-health/failure-domains.md
